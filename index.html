<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unity WebGL Player | Flat Zombies</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <script>
    // GameMonetize compatibility
    window.gmEvent = window.gmEvent || function () {
      console.log("[gmEvent] gmEvent ignored");
    };
  </script>
</head>

<body>

<div id="unity-container" class="unity-desktop">

  <canvas id="unity-canvas" width="960" height="600"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>

    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-warning"></div>

  <div id="unity-footer">
    <div id="unity-webgl-logo"></div>
    <div id="unity-fullscreen-button"></div>
    <div id="unity-build-title">Flat Zombies</div>
  </div>

</div>

<script>

const container = document.querySelector("#unity-container");
const canvas = document.querySelector("#unity-canvas");
const loadingBar = document.querySelector("#unity-loading-bar");
const progressBarFull = document.querySelector("#unity-progress-bar-full");
const fullscreenButton = document.querySelector("#unity-fullscreen-button");
const warningBanner = document.querySelector("#unity-warning");


function unityShowBanner(msg, type) {

  function updateBannerVisibility() {
    warningBanner.style.display =
      warningBanner.children.length ? "block" : "none";
  }

  const div = document.createElement("div");

  div.innerHTML = msg;

  warningBanner.appendChild(div);

  if (type === "error") {

    div.style =
      "background:red;padding:10px;";

  } else if (type === "warning") {

    div.style =
      "background:yellow;padding:10px;";

    setTimeout(function () {

      if (div.parentNode === warningBanner) {
        warningBanner.removeChild(div);
      }

      updateBannerVisibility();

    }, 5000);
  }

  updateBannerVisibility();
}


/*
 * Merge split files in the browser.
 */
async function mergeParts(parts, name) {

  console.log("[SplitLoader] Loading " + name);

  const chunks = [];

  let totalSize = 0;


  for (let i = 0; i < parts.length; i++) {

    const url = parts[i];

    console.log(
      "[SplitLoader] Fetching " + url
    );

    const response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {

      throw new Error(
        "Failed to load " +
        url +
        " - HTTP " +
        response.status
      );

    }


    const buffer =
      await response.arrayBuffer();

    const chunk =
      new Uint8Array(buffer);

    chunks.push(chunk);

    totalSize +=
      chunk.byteLength;


    console.log(
      "[SplitLoader] " +
      url +
      " loaded: " +
      (chunk.byteLength / 1024 / 1024).toFixed(2) +
      " MB"
    );
  }


  const merged =
    new Uint8Array(totalSize);

  let offset = 0;


  for (const chunk of chunks) {

    merged.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;
  }


  console.log(
    "[SplitLoader] " +
    name +
    " merged: " +
    (merged.byteLength / 1024 / 1024).toFixed(2) +
    " MB"
  );


  return URL.createObjectURL(
    new Blob(
      [merged],
      {
        type: "application/octet-stream"
      }
    )
  );
}


async function startUnity() {

  try {

    loadingBar.style.display =
      "block";


    /*
     * Web.data
     */
    progressBarFull.style.width =
      "5%";

    const dataUrl =
      await mergeParts(
        [
          "Build/Web.data.part00",
          "Build/Web.data.part01"
        ],
        "Web.data"
      );


    progressBarFull.style.width =
      "35%";


    /*
     * Web.wasm
     */
    const codeUrl =
      await mergeParts(
        [
          "Build/Web.wasm.part00",
          "Build/Web.wasm.part01"
        ],
        "Web.wasm"
      );


    progressBarFull.style.width =
      "60%";


    /*
     * Unity configuration
     */
    const buildUrl =
      "Build";

    const loaderUrl =
      buildUrl +
      "/Web.loader.js";


    const config = {

      dataUrl:
        dataUrl,

      frameworkUrl:
        buildUrl +
        "/Web.framework.js",

      codeUrl:
        codeUrl,

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "Viet guy but yeah aka ricefarmer",

      productName:
        "Flat Zombies",

      productVersion:
        "1.0",

      showBanner:
        unityShowBanner,

      autoSyncPersistentDataPath:
        true
    };


    /*
     * Desktop
     */
    if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

      canvas.style.width =
        "960px";

      canvas.style.height =
        "600px";

    } else {

      container.className =
        "unity-mobile";

      canvas.className =
        "unity-mobile";
    }


    canvas.style.background =
      "url('Build/Web.jpg') center / cover";


    /*
     * Load Unity loader.
     */
    const script =
      document.createElement("script");

    script.src =
      loaderUrl;


    script.onload =
      function () {

        console.log(
          "[Unity] Loader loaded."
        );


        createUnityInstance(
          canvas,
          config,

          function (progress) {

            progressBarFull.style.width =
              (60 + progress * 40) + "%";

          }

        ).then(
          function (unityInstance) {

            console.log(
              "[Unity] Game loaded successfully."
            );

            loadingBar.style.display =
              "none";


            fullscreenButton.onclick =
              function () {

                unityInstance.SetFullscreen(1);

              };

          }

        ).catch(
          function (message) {

            console.error(
              "[Unity] Failed:",
              message
            );

            unityShowBanner(
              String(message),
              "error"
            );

          }
        );
      };


    script.onerror =
      function () {

        unityShowBanner(
          "Failed to load Build/Web.loader.js",
          "error"
        );

      };


    document.body.appendChild(
      script
    );

  } catch (error) {

    console.error(
      "[SplitLoader] Error:",
      error
    );

    loadingBar.style.display =
      "none";

    unityShowBanner(
      error.message,
      "error"
    );
  }
}


startUnity();

</script>

</body>
</html>
